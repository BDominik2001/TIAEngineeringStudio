name: release

# Kiadás SemVer tagből (docs/RELEASE_PROCESS.md). Kimenet: TIA-verziónként egy csomag
# (TIAStudio_<ver>_TIA18|19|20_win-x64.zip), checksums.sha256, release-manifest.json és egy
# PISZKOZAT GitHub Release, amelyet a kiadási checklist után ember publikál.
#
# Biztonság (szabályzat 9. pont):
# - csak tag pushra / kézi indításra fut, Pull Requestre soha;
# - a csomagolás a licencelt TIA-t futtató self-hosted runneren, a "release" environment
#   jóváhagyásával fut (Settings -> Environments -> release -> Required reviewers);
# - meglévő tag Release-e nem írható felül (a gh release create hibával áll le);
# - PLC-letöltés, online kapcsolat nincs; a TIA-teszt csak sandbox/demó projekten fut.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Meglévő SemVer tag (pl. v0.2.0-rc.1)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tag matches the application version
        run: |
          version=$(python scripts/tools/build_info.py | python -c "import json,sys; print(json.load(sys.stdin)['appVersion'])")
          [ "$TAG" = "v$version" ] || { echo "tag $TAG != v$version (Directory.Build.props)"; exit 1; }
          python scripts/tools/build_info.py --check
      - name: Release does not exist yet (tags and assets are immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists - publish a new PATCH version instead"; exit 1
          fi
      - name: CHANGELOG has a section for this version
        run: grep -q "^## \[${TAG#v}\]" CHANGELOG.md
      - name: Offline tests
        run: |
          rustup component add clippy
          bash scripts/test-offline.sh

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        tia: [V18, V19, V20]
    # Runner-címkék: a TIA Portal + Openness adott verziója telepítve (docs/RELEASE_PROCESS.md)
    runs-on: [self-hosted, windows, x64, "tia-${{ matrix.tia }}"]
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Package (worker linked against the installed Openness)
        shell: pwsh
        run: ./scripts/package-release.ps1 -Tia ${{ matrix.tia }} -RequireOpenness -OutputDir "$env:RUNNER_TEMP\release"
      - name: TIA integration test (sandbox only)
        id: tia
        shell: pwsh
        env:
          KNOWN_GOOD: ${{ vars[format('TES_TIA_KNOWN_GOOD_PROJECT_{0}', matrix.tia)] }}
        run: |
          $status = @{ tia = '${{ matrix.tia }}'; integration = 'not-run'; run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" }
          if ($env:KNOWN_GOOD) {
            $version = (Get-Content Directory.Build.props -Raw) -replace '(?s).*<Version>([^<]+)</Version>.*', '$1'
            $workers = Join-Path $env:RUNNER_TEMP "release\TIAStudio_${version}_TIA$('${{ matrix.tia }}'.Substring(1))_win-x64\workers"
            try {
              ./scripts/test-tia-integration.ps1 -Version ${{ matrix.tia }} -KnownGoodProject $env:KNOWN_GOOD -WorkersDir $workers
              $status.integration = 'passed'
            } catch {
              $status.integration = 'failed'
              Write-Error $_ -ErrorAction Continue
            }
          } else {
            Write-Warning 'TES_TIA_KNOWN_GOOD_PROJECT_${{ matrix.tia }} is not set: package status will be "Supported, integration test pending".'
          }
          $results = Join-Path $env:RUNNER_TEMP 'release\tia-results-${{ matrix.tia }}'
          New-Item -ItemType Directory -Force $results | Out-Null
          if (Test-Path artifacts) { Get-ChildItem artifacts -Directory -Filter 'tia-integration-*' | Copy-Item -Destination $results -Recurse }
          $status | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'release\tia-status-${{ matrix.tia }}.json')
          if ($status.integration -eq 'failed') { exit 1 }
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.tia }}
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/tia-status-*.json
            ${{ runner.temp }}/release/tia-results-*/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Checksums, manifest, release notes
        run: python scripts/tools/release_manifest.py --dir release --tag "$TAG" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Draft GitHub Release (never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft $prerelease \
            --title "TIA Engineering Studio $TAG" --notes-file release/release-notes.md \
            release/*.zip release/checksums.sha256 release/release-manifest.json
